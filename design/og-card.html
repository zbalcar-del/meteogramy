<!doctype html>
<html lang="cs">
<meta charset="utf-8">
<title>Meteogramy.cz — OG karta</title>
<style>
* { box-sizing: border-box; }
html,body { margin:0; width:1200px; height:630px; overflow:hidden; }
body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:#15191f;
  background:radial-gradient(ellipse at 78% 52%,#dcecff 0%,#edf4fc 44%,#f8fafd 78%); }
.logo { position:absolute; left:42px; top:280px; display:flex; align-items:center; gap:13.2px; }
.gl { position:relative; display:block; border-radius:22.75%;
  box-shadow:0 1px 2px rgba(16,60,120,.16),0 4px 12px rgba(16,60,120,.14); }
.gl img { display:block; width:54px; height:54px; border-radius:inherit; }
.gl::after { content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,0) 42%);
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.4),inset 0 1.5px 1px -.5px rgba(255,255,255,.85),inset 1px 0 1px -.5px rgba(255,255,255,.35),inset 0 -1px 1px -.5px rgba(255,255,255,.45); }
.bn { font-weight:700; font-size:20.4px; letter-spacing:-.01em; line-height:1.15; white-space:nowrap; }
.tag { font-size:14.4px; color:#858c96; line-height:1.3; margin-top:1.2px; }
.card { position:absolute; left:342px; top:28px; width:816px; height:574px; border-radius:8px;
  overflow:hidden; background:#f8f8fa; box-shadow:0 26px 60px -18px rgba(40,77,125,.26),0 0 0 1px rgba(34,67,110,.055); }
.card img { display:block; width:816px; height:581.4px; }
.card iframe { display:block; width:1600px; height:1125px; border:0; transform:scale(.51); transform-origin:0 0; pointer-events:none; }
.canvas { position:relative; width:1200px; height:630px; }
@media (min-width:2000px) {
  html,body { width:2400px; height:1260px; }
  .canvas { transform:scale(2); transform-origin:0 0; }
}
</style>
<div class="canvas">
<div class="logo"><span class="gl"><img src="../web/assets/logo.png" alt=""></span><div><div class="bn">Meteogramy.cz</div><div class="tag">horské meteogramy</div></div></div>
<div class="card"><img src="og-homepage-source.png" alt="Skutečná homepage Meteogramy.cz"></div>
</div>
<script>
// Při finálním exportu vykreslí UI přímo prohlížeč, bez komprese mezilehlého screenshotu.
if (new URLSearchParams(location.search).has('live')) {
  const frame = document.createElement('iframe');
  frame.src = 'http://localhost:8771/';
  frame.title = 'Meteogramy.cz';
  document.querySelector('.card').replaceChildren(frame);
}
</script>
</html>
