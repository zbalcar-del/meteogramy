    <path d="M48 268 C100 268 125 218 168 218 C211 218 237 270 278 270 C312 270 326 239 352 239 V302H48Z" fill="url(#front)" />
    <path d="M48 268 C100 268 125 218 168 218 C211 218 237 270 278 270 C312 270 326 239 352 239" fill="none" stroke="#fff" stroke-width="7" />
  </g>
  <g class="weather sunny" transform="translate(18.5 0)">
