<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2=".8" y2="1">
      <stop stop-color="#6fc9f2" />
      <stop offset=".5" stop-color="#348bdf" />
      <stop offset="1" stop-color="#1856b4" />
    </linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fff" stop-opacity=".62" />
      <stop offset="1" stop-color="#dcf1ff" stop-opacity=".13" />
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fff" stop-opacity=".97" />
      <stop offset="1" stop-color="#dcf1ff" stop-opacity=".45" />
    </linearGradient>
    <filter id="s" x="-40%" y="-40%" width="180%" height="190%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#16487c" flood-opacity=".16" />
    </filter>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fff0be" />
      <stop offset="1" stop-color="#ffd27a" />
    </linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fff" />
      <stop offset="1" stop-color="#e5f3ff" />
    </linearGradient>
    <clipPath id="graphClip">
      <rect x="68" y="158" width="264" height="142" rx="7" />
    </clipPath>
  </defs>
  <style>
.weather { animation: weather-cycle 18s linear infinite; opacity: 0; }
.partly { opacity: 1; }
.sunny { animation-delay: -12s; }
.rainy { animation-delay: -6s; }
@keyframes weather-cycle { 0%, 29% { opacity: 1; } 33%, 96% { opacity: 0; } 100% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .weather { animation: none; opacity: 0; } .partly { opacity: 1; } }
</style>
  <rect width="400" height="400" rx="91" fill="url(#bg)" />
  <rect x="1" y="1" width="398" height="398" rx="90" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="2" />
